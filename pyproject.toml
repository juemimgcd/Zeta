[project]
name = "zeta"
version = "0.1.0"
description = "A local coding agent implemented in Python"
readme = "README.md"
authors = [
    { name = "juemimgcd", email = "juemimgcd@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "langchain-core",
    "langchain-openai==1.6.2",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-ai-slim[openai]>=2.37.0,<3.0.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
zeta = "zeta.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411,<2.0.0",
    "ruff>=0.16.5,<0.17.0",
]

[tool.ruff]
target-version = "py314"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
